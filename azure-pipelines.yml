trigger:
- main
- 'test-pr-*'

pr:
  branches:
    include:
    - main
    - 'test-pr-*'

steps:
 # Checkout the repository
- checkout: self
  fetchDepth: 0

# Prepare Analysis Configuration task
- task: SonarCloudPrepare@4
  inputs:
    SonarCloud: 'sonarcloud.io'
    organization: 'luisrodriguezfernandez'
    scannerMode: 'other'
    extraProperties: | 
      sonar.projectKey=luisrodriguezfernandez_simple-java-for-pr-decoration

# If you use Maven: add the Execute Maven goal as shown below
- task: Maven@4
  inputs:
    jdkVersionOption: 1.21
    goals: 'clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar'
    extraProperties: |
      -X

# Publish Quality Gate Result task
- task: SonarCloudPublish@4
  inputs:
    pollingTimeoutSec: '300'